---
openapi: 3.0.3
info:
  title: material composition
  version: v1
  x-samm-aspect-model-urn: "urn:samm:io.catenax.batterypass.component_supplier.material_composition:1.0.0#MaterialComposition"
servers:
- url: catenax.io/api/v1
  variables:
    api-version:
      default: v1
paths:
  /{tenant-id}/material-composition:
    get:
      tags:
      - MaterialComposition
      operationId: getMaterialComposition
      parameters:
      - name: tenant-id
        in: path
        description: The ID of the tenant owning the requested Twin.
        required: true
        schema:
          type: string
          format: uuid
      - name: start
        in: query
        description: Starting index which is starting by 0
        required: false
        schema:
          type: number
      - name: count
        in: query
        description: Number of items to return per call.
        required: false
        schema:
          type: number
      - name: totalItemCount
        in: query
        description: Flag that indicates that the total counts should be returned.
        required: false
        schema:
          type: boolean
      responses:
        "200":
          $ref: "#/components/responses/MaterialComposition"
        "400":
          $ref: "#/components/responses/ClientError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundError"
components:
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      required:
      - details
      properties:
        message:
          type: string
          minLength: 1
        path:
          type: string
          minLength: 1
        details:
          type: object
          minLength: 1
          additionalProperties:
            type: object
        code:
          type: string
          nullable: true
    PagingSchema:
      type: object
      properties:
        totalItems:
          type: number
        totalPages:
          type: number
        pageSize:
          type: number
        currentPage:
          type: number
        batteryChemistry:
          type: array
          items:
            $ref: "#/components/schemas/MaterialComposition"
    Text:
      type: string
      x-samm-aspect-model-urn: "urn:samm:org.eclipse.esmf.samm:characteristic:2.2.0#Text"
      description: "Describes a Property which contains plain text. This is intended\
        \ exclusively for human readable strings, not for identifiers, measurement\
        \ values, etc."
    BatteryChemistry:
      description: Chemistry of battery.
      x-samm-aspect-model-urn: "urn:samm:io.catenax.batterypass.component_supplier.material_composition:1.0.0#BatteryChemistry"
      type: object
      properties:
        ShortName:
          description: Short name.
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#shortName"
          allOf:
          - $ref: "#/components/schemas/Text"
        ClearName:
          description: Clear name.
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#clearName"
          allOf:
          - $ref: "#/components/schemas/Text"
    BatteryChemistryEntityList:
      description: |-
        Detailed composition, including materials used in the cathode, anode, and electrolyte.
        All common cells have two electrodes and an electrolyte. The specific combination of materials used to make these components is called "chemistry." A cell's chemistry largely determines its properties, while most variations within it are caused by additives, purification, and design elements.

        EUBR: Annex XIII (1b) ? Annex VI Part A (7)
      x-samm-aspect-model-urn: "urn:samm:io.catenax.batterypass.component_supplier.material_composition:1.0.0#BatteryChemistryEntityList"
      type: object
      allOf:
      - $ref: "#/components/schemas/BatteryChemistry"
    BatteryComponentEntity:
      description: Battery component that includes the material.
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#BatteryComponentEntity"
      type: object
      properties:
        ComponentName:
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#componentName"
          allOf:
          - $ref: "#/components/schemas/Text"
        ComponentId:
          description: Identifier of the component.
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#componentId"
          allOf:
          - $ref: "#/components/schemas/Text"
    BatteryMaterialLocation:
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#BatteryMaterialLocation"
      type: object
      allOf:
      - $ref: "#/components/schemas/BatteryComponentEntity"
    WeightInKilogram:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#WeightInKilogram"
    Boolean:
      type: boolean
      x-samm-aspect-model-urn: "urn:samm:org.eclipse.esmf.samm:characteristic:2.2.0#Boolean"
      description: Represents a boolean value (i.e. a "flag").
    BatteryMaterial:
      description: Material of battery.
      x-samm-aspect-model-urn: "urn:samm:io.catenax.batterypass.component_supplier.material_composition:1.0.0#BatteryMaterial"
      type: object
      properties:
        BatteryMaterialLocation:
          description: Battery component that relates to the material.
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#batteryMaterialLocation"
          allOf:
          - $ref: "#/components/schemas/BatteryMaterialLocation"
        BatteryMaterialIdentifier:
          description: "The materials should be named using a public standard or agreed\
            \ nomenclature, which refers e.g. to the nomenclature of IUPAC or related\
            \ identifiers such as the CAS (Chemical Abstracts Service) number. \n\n\
            DIN DKE Spec 99100 chapter reference: 6.5.4 k)"
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#batteryMaterialIdentifier"
          allOf:
          - $ref: "#/components/schemas/Text"
        BatteryMaterialName:
          description: |-
            Clear name of Material.

             Alphanumeric character string which describes the object.
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#batteryMaterialName"
          allOf:
          - $ref: "#/components/schemas/Text"
        BatteryMaterialMass:
          description: Weight of component material in Kilogram.
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#batteryMaterialMass"
          allOf:
          - $ref: "#/components/schemas/WeightInKilogram"
        IsCriticalRawMaterial:
          description: "The battery passport must contain information on the critical\
            \ raw materials present in the battery.\n\nThe information on the critical\
            \ raw materials must also be provided on the battery label.\nPer Annex\
            \ VI, Part A(10), critical raw materials must be reported if present in\
            \ the battery in a concentration of more than 0,1 % weight by weight. "
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#isCriticalRawMaterial"
          allOf:
          - $ref: "#/components/schemas/Boolean"
      required:
      - BatteryMaterialIdentifier
      - BatteryMaterialName
      - IsCriticalRawMaterial
    BatteryMaterialList:
      description: |-
        Detailed composition, including materials used in the cathode, anode, and electrolyte

        EUBR: Annex XIII (2a)
      x-samm-aspect-model-urn: "urn:samm:io.catenax.batterypass.component_supplier.material_composition:1.0.0#BatteryMaterialList"
      type: array
      items:
        $ref: "#/components/schemas/BatteryMaterial"
    HazardousSubstanceClassEnum:
      type: string
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#HazardousSubstanceClassEnum"
      enum:
      - AcuteToxicity
      - SkinCorrosionOrIrritation
      - EyeDamageOrIrritation
    HazardousSubstanceConcentrationCharacteristic:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#HazardousSubstanceConcentrationCharacteristic"
    ImpactList:
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#ImpactList"
      type: array
      items:
        type: string
        x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#Impact"
        description: Impact.
    HazardousSubstanceLocation:
      description: "The impact of substances, in particular, hazardous substances,\
        \ contained in batteries on the environment and on human health or safety\
        \ of persons, including impact due to inappropriate discarding of waste batteries\
        \ such as littering or discarding as unsorted municipal waste."
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#HazardousSubstanceLocation"
      type: object
      allOf:
      - $ref: "#/components/schemas/BatteryComponentEntity"
    HazardousSubstance:
      description: "Hazardous substances (No. 19-23): Name (agreed substance nomenclature,\
        \ e.g. IUPAC or chemical name) all hazardous substance (as any substance that\
        \ poses a threat to human health and the environment'). Suggested above 0.1\
        \ % weight by weight within each (sub-)component."
      x-samm-aspect-model-urn: "urn:samm:io.catenax.batterypass.component_supplier.material_composition:1.0.0#HazardousSubstance"
      type: object
      properties:
        HazardousSubstanceClass:
          description: Battery Regulation narrows reporting to substances falling
            under defined hazard classes and categories of the CLP regulation.
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#hazardousSubstanceClass"
          allOf:
          - $ref: "#/components/schemas/HazardousSubstanceClassEnum"
        HazardousSubstanceName:
          description: Clear name of hazardous substance.
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#hazardousSubstanceName"
          allOf:
          - $ref: "#/components/schemas/Text"
        HazardousSubstanceIdentifier:
          description: Material name or identifier of hazardous substance.
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#hazardousSubstanceIdentifier"
          allOf:
          - $ref: "#/components/schemas/Text"
        HazardousSubstanceConcentration:
          description: Concentration of hazardous substance.
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#hazardousSubstanceConcentration"
          allOf:
          - $ref: "#/components/schemas/HazardousSubstanceConcentrationCharacteristic"
        HazardousSubstanceImpact:
          description: "Impact statements based on, e.g., REACH or GHS for all hazard\
            \ classes applicable to substances in the battery."
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#hazardousSubstanceImpact"
          allOf:
          - $ref: "#/components/schemas/ImpactList"
        HazardousSubstanceLocation:
          description: "Hazardous substances (No. 19-23): \n   Location on a (sub-)component-level\
            \ of all hazardous substances \n   (as 'any substance that poses a threat\
            \ to human health and the environment'). \n   \n   Suggested via a unique\
            \ identifier or nomenclature."
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.material_composition:1.0.1#hazardousSubstanceLocation"
          allOf:
          - $ref: "#/components/schemas/HazardousSubstanceLocation"
      required:
      - HazardousSubstanceName
      - HazardousSubstanceIdentifier
    HazardousSubstancesList:
      description: |-
        Hazardous substances contained in the battery other than mercury, cadmium or lead. Substance as a chemical element and its compounds in the natural state or the result of a manufacturing process (ECHA). Battery Regulation narrows reporting to substances falling under defined hazard classes and categories of the CLP regulation.

        EUBR: Annex XIII (1b) ? Annex VI Part A (8)
      x-samm-aspect-model-urn: "urn:samm:io.catenax.batterypass.component_supplier.material_composition:1.0.0#HazardousSubstancesList"
      type: array
      items:
        $ref: "#/components/schemas/HazardousSubstance"
    MaterialComposition:
      description: "Mandatory data: Battery chemistry; critical raw materials; materials\
        \ used in the cathode, anode, and \nelectrolyte; hazardous substances; impact\
        \ of substances on the environment and on human health or \nsafety."
      type: object
      x-samm-aspect-model-urn: "urn:samm:io.catenax.batterypass.component_supplier.material_composition:1.0.0#MaterialComposition"
      properties:
        BatteryChemistry:
          description: |-
            Composition of a product in general terms by specifying the cathode and anode active material as well as electrolyte.

            DIN DKE Spec 99100 chapter reference: 6.5.2
          x-samm-aspect-model-urn: "urn:samm:io.catenax.batterypass.component_supplier.material_composition:1.0.0#batteryChemistry"
          allOf:
          - $ref: "#/components/schemas/BatteryChemistryEntityList"
        BatteryMaterials:
          description: |-
            "Component materials used" (No. 17.a-c): Naming the materials (as a composition of substances) in cathode, anode, electrolyte according to public standards, including specification of the corresponding component (i.e., cathode, anode, or electrolyte). We suggest a reporting threshold of 0.1 % weight by weight.

            DIN DKE Spec 99100 chapter reference: 6.5.3-6.5.4
          x-samm-aspect-model-urn: "urn:samm:io.catenax.batterypass.component_supplier.material_composition:1.0.0#batteryMaterials"
          allOf:
          - $ref: "#/components/schemas/BatteryMaterialList"
        HazardousSubstances:
          description: |-
            "Hazardous substances" (No 20.a-e): Name (agreed substance nomenclature, e.g. IUPAC or chemical name) all hazardous substance (as 'any substance that poses a threat to human health and the environment'). Suggested above 0.1 % weight by weight within each (sub-)component.

            DIN DKE Spec 99100 chapter reference: 6.5.4 - 6.5.6
          x-samm-aspect-model-urn: "urn:samm:io.catenax.batterypass.component_supplier.material_composition:1.0.0#hazardousSubstances"
          allOf:
          - $ref: "#/components/schemas/HazardousSubstancesList"
      required:
      - BatteryMaterials
      - HazardousSubstances
  responses:
    Unauthorized:
      description: The requesting user or client is not authenticated.
    Forbidden:
      description: The requesting user or client is not authorized to access resources.
    NotFoundError:
      description: The requested resource has not been found.
    ClientError:
      description: Payload or user input is invalid. See error details in the payload
        for more information.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MaterialComposition:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PagingSchema"
      description: The request was successful.
  requestBodies:
    MaterialComposition:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MaterialComposition"
      required: true
