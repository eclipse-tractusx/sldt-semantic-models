---
openapi: 3.0.3
info:
  title: CBAM
  version: v1
  x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#Cbam"
servers:
- url: catenax.io/api/v1
  variables:
    api-version:
      default: v1
paths:
  /{tenant-id}/cbam:
    get:
      tags:
      - Cbam
      operationId: getCbam
      parameters:
      - name: tenant-id
        in: path
        description: The ID of the tenant owning the requested Twin.
        required: true
        schema:
          type: string
          format: uuid
      - name: start
        in: query
        description: Starting index which is starting by 0
        required: false
        schema:
          type: number
      - name: count
        in: query
        description: Number of items to return per call.
        required: false
        schema:
          type: number
      - name: totalItemCount
        in: query
        description: Flag that indicates that the total counts should be returned.
        required: false
        schema:
          type: boolean
      responses:
        "200":
          $ref: "#/components/responses/Cbam"
        "400":
          $ref: "#/components/responses/ClientError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundError"
components:
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      required:
      - details
      properties:
        message:
          type: string
          minLength: 1
        path:
          type: string
          minLength: 1
        details:
          type: object
          minLength: 1
          additionalProperties:
            type: object
        code:
          type: string
          nullable: true
    PagingSchema:
      type: object
      properties:
        items:
          type: array
          $ref: "#/components/schemas/Cbam"
        totalItems:
          type: number
        totalPages:
          type: number
        pageSize:
          type: number
        currentPage:
          type: number
    FreeStringCharacteristic:
      type: string
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#FreeStringCharacteristic"
      description: Characteristic for text properties without any constraints.
    KeyValueEntity:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#KeyValueEntity"
      type: object
      properties:
        key:
          description: Name of the identifier type.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#key"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        value:
          description: Value of the stated identifier type.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#value"
          $ref: "#/components/schemas/FreeStringCharacteristic"
      required:
      - key
      - value
    KeyValueCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#KeyValueCharacteristic"
      type: array
      items:
        $ref: "#/components/schemas/KeyValueEntity"
    TransactionReferenceDocumentLinkCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#TransactionReferenceDocumentLinkCharacteristic"
      type: object
      properties:
        refDocElement:
          description: "Additional locator/metadata to identify a specific element\
            \ within the referenced document (e.g., line item, position number, material\
            \ code, annex section). Used when the document covers multiple goods/operators\
            \ and you need to specify which part applies."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#refDocElement"
          $ref: "#/components/schemas/KeyValueCharacteristic"
        refDocValue:
          description: Identifier of the referenced document; must match the corresponding
            reference document value from the request.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#refDocValue"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        refDocKey:
          description: Type of the referenced document; must match a reference document
            type from the business transaction details object in the request.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#refDocKey"
          $ref: "#/components/schemas/FreeStringCharacteristic"
      required:
      - refDocElement
      - refDocValue
      - refDocKey
    BooleanCharacteristic:
      type: boolean
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#BooleanCharacteristic"
    BpnlCharacteristic:
      type: string
      description: "The provided regular expression ensures that the Business Partner\
        \ Number Legal Entity (BPNL) is composed of prefix 'BPNL', 10 digits and two\
        \ alphanumeric letters."
      x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.business_partner_number:3.0.0#BpnlCharacteristic"
      pattern: "^BPNL[a-zA-Z0-9]{12}$"
    OperatorIdsCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#OperatorIdsCharacteristic"
      type: object
      properties:
        operatorBpnl:
          description: "BPNL (business partner number legal) of operator, if company\
            \ is registered at Catena-X."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#operatorBpnl"
          $ref: "#/components/schemas/BpnlCharacteristic"
        operatorCbamId:
          description: Unique identifier for the operator in the official EU O3CI
            portal (operator of third country installation).
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#operatorCbamId"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        otherIds:
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#otherIds"
          $ref: "#/components/schemas/KeyValueCharacteristic"
      required:
      - operatorBpnl
      - operatorCbamId
      - otherIds
    CountryAlpha3Trait:
      type: string
      x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.standard_codes:1.0.0#CountryAlpha3Trait"
      description: trait for 3 letter country code
      pattern: "^[A-Z]{3}$"
    AddressCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#AddressCharacteristic"
      type: object
      properties:
        city:
          description: The city where the operator is located.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#city"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        street:
          description: The street where the operator is located.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#street"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        country:
          description: Alphabetic three-character (alpha-3) code representing a country
            name.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.standard_codes:1.0.0#country"
          $ref: "#/components/schemas/CountryAlpha3Trait"
    OperatorIdentificationCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#OperatorIdentificationCharacteristic"
      type: object
      properties:
        operatorIsSupplier:
          description: "Boolean property indicating whether the supplier (i.e., the\
            \ business transaction partner) is also the installation operator."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#operatorIsSupplier"
          $ref: "#/components/schemas/BooleanCharacteristic"
        operatorIds:
          description: Unique set of identifiers for the operator. BPNL and Operator
            CBAM ID are listed as separate attributes.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#operatorIds"
          $ref: "#/components/schemas/OperatorIdsCharacteristic"
        operatorName:
          description: Name of the operator
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#operatorName"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        operatorContactEmailAddress:
          description: The email address of the person that is assigned in the contact
            details of the operator.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#operatorContactEmailAddress"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        address:
          description: Object containing attributes that document the address of the
            installation.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#address"
          $ref: "#/components/schemas/AddressCharacteristic"
    InstallationIdsCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#InstallationIdsCharacteristic"
      type: object
      properties:
        installationCbamId:
          description: Unique identifier for the installation in the official EU O3CI
            portal (operator of third country installation).
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#installationCbamId"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        otherIds:
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#otherIds"
          $ref: "#/components/schemas/KeyValueCharacteristic"
      required:
      - installationCbamId
      - otherIds
    FreeNumberCharacteristic:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#FreeNumberCharacteristic"
    InstallationAddressCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#InstallationAddressCharacteristic"
      type: object
      properties:
        country:
          description: Alphabetic three-character (alpha-3) code representing a country
            name.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.standard_codes:1.0.0#country"
          $ref: "#/components/schemas/CountryAlpha3Trait"
        city:
          description: The city where the operator is located.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#city"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        longitude:
          description: The longitude where the installation is located.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#longitude"
          $ref: "#/components/schemas/FreeNumberCharacteristic"
        latitude:
          description: The latitude where the installation is located.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#latitude"
          $ref: "#/components/schemas/FreeNumberCharacteristic"
        typeOfCoordinates:
          description: "The type of coordinates: 01 GPS, 02 GNSS."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#typeOfCoordinates"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        pilotOrParcelNumber:
          description: The plot or parcel number of the location.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#pilotOrParcelNumber"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        unLoCode:
          description: The United Nations Code for Trade and Transport Locations (UN/LOCODE)
            as defined by UNECE list.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#unLoCode"
          $ref: "#/components/schemas/FreeStringCharacteristic"
      required:
      - country
      - city
    InstallationIdentificationCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#InstallationIdentificationCharacteristic"
      type: object
      properties:
        installationIds:
          description: Unique set of identifiers of the installation.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#installationIds"
          $ref: "#/components/schemas/InstallationIdsCharacteristic"
        installationName:
          description: Name of the installation.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#installationName"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        address:
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#installationAddress"
          $ref: "#/components/schemas/InstallationAddressCharacteristic"
    Text:
      type: string
      x-samm-aspect-model-urn: "urn:samm:org.eclipse.esmf.samm:characteristic:2.2.0#Text"
      description: "Describes a Property which contains plain text. This is intended\
        \ exclusively for human readable strings, not for identifiers, measurement\
        \ values, etc."
    Timestamp:
      type: string
      pattern: "-?([1-9][0-9]{3,}|0[0-9]{3})-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T(([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\\\
        .[0-9]+)?|(24:00:00(\\.0+)?))(Z|(\\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00))?"
      x-samm-aspect-model-urn: "urn:samm:org.eclipse.esmf.samm:characteristic:2.2.0#Timestamp"
      description: Describes a Property which contains the date and time with an optional
        timezone.
    AttestationOfConformanceEntity:
      description: Entity to group all attestation of conformance properties.
      x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.attestation_of_conformance:1.0.0#AttestationOfConformanceEntity"
      type: object
      properties:
        attestationType:
          description: "The specific type of the attestation, which defines its nature\
            \ and the level of trust or authority it conveys."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.attestation_of_conformance:1.0.0#attestationType"
          $ref: "#/components/schemas/Text"
        standardName:
          description: The specific cross-sectoral standards or product or sector
            rules (PCRs) on which the attestation of conformance is based.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.attestation_of_conformance:1.0.0#standardName"
          $ref: "#/components/schemas/Text"
        attestationStandard:
          description: Reference standard or rulebook which serves as the basis for
            the attestation of conformance.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.attestation_of_conformance:1.0.0#attestationStandard"
          $ref: "#/components/schemas/Text"
        attestationOfConformanceId:
          description: "A unique identifier assigned to the attestation document for\
            \ tracking, referencing, and verification purposes."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.attestation_of_conformance:1.0.0#attestationOfConformanceId"
          $ref: "#/components/schemas/Text"
        attestationOfConformanceLink:
          description: A URL or web link directing to the official digital document
            or registry entry to verify the authenticity and status of the attestation.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.attestation_of_conformance:1.0.0#attestationOfConformanceLink"
          $ref: "#/components/schemas/Text"
        providerName:
          description: The official legal name of the organization or body that issued
            the attestation.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.attestation_of_conformance:1.0.0#providerName"
          $ref: "#/components/schemas/Text"
        providerId:
          description: "A unique identifier for the entity issuing the declaration,\
            \ such as a Business Partner Number (BPN) or other official registration\
            \ number, issued by the appointing organization or accreditation institute."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.attestation_of_conformance:1.0.0#providerId"
          $ref: "#/components/schemas/Text"
        completedAt:
          description: Time stamp for when the attestation of conformity was issued
          x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.attestation_of_conformance:1.0.0#completedAt"
          $ref: "#/components/schemas/Timestamp"
      required:
      - attestationType
      - standardName
      - attestationStandard
      - attestationOfConformanceId
      - providerName
    AttestationOfConformanceCollection:
      description: Collection of Attestation of Conformance properties for a given
        Asset.
      x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.attestation_of_conformance:1.0.0#AttestationOfConformanceCollection"
      type: array
      items:
        $ref: "#/components/schemas/AttestationOfConformanceEntity"
    ProductionMethodCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#ProductionMethodCharacteristic"
      type: object
      properties:
        methodId:
          description: Specific identifier of the production method according the
            official value list provided by the CBAM declarant portal.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#methodId"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        specificSteelMillId:
          description: "Specific identifier of the steel mill used for the production\
            \ of the good, if applicable."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#specificSteelMillId"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        additionalInformation:
          description: Any additional information that the supplier wants to provide
            with regard to the production method.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#additionalInformation"
          $ref: "#/components/schemas/FreeStringCharacteristic"
      required:
      - methodId
    DatetimeCharacteristic:
      type: string
      pattern: "-?([1-9][0-9]{3,}|0[0-9]{3})-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T(([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\\\
        .[0-9]+)?|(24:00:00(\\.0+)?))(Z|(\\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00))?"
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#DatetimeCharacteristic"
    ProductionMethodActivityDataCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#ProductionMethodActivityDataCharacteristic"
      type: object
      properties:
        referencePeriodStart:
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#referencePeriodStart"
          $ref: "#/components/schemas/DatetimeCharacteristic"
        referencePeriodEnd:
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#referencePeriodEnd"
          $ref: "#/components/schemas/DatetimeCharacteristic"
        netMass:
          description: Net mass (in tonnes) of the CBAM-relevant good attributable
            to the specific request produced in the stated installation by the stated
            production method only.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#activityDataNetMass"
          $ref: "#/components/schemas/FreeNumberCharacteristic"
      required:
      - netMass
    DirectEmissionsCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#DirectEmissionsCharacteristic"
      type: object
      properties:
        additionalInformation:
          description: Any additional information that the supplier wants to provide
            with regard to direct embedded emissions.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#additionalInformationDirectEmissions"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        specificEmbeddedEmissionsDirect:
          description: Object deailing the indirect embedded emissions referenced
            to the specific production method and installation.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#specificEmbeddedEmissionsDirect"
          $ref: "#/components/schemas/FreeNumberCharacteristic"
      required:
      - specificEmbeddedEmissionsDirect
    IndirectEmissionsCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#IndirectEmissionsCharacteristic"
      type: object
      properties:
        sourceOfEmissionFactor:
          description: "Declaration of applied literature or published information\
            \ by the statistics office, according to following allowed values: 01\
            \ Other, 02 Commission based on IEA data."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#sourceOfEmissionFactor"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        emissionFactorTonnesCo2PerMwh:
          description: "This element declares the applied emission factor for electricity,\
            \ expressed as tonnes CO2 per MWh."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#emissionFactorTonnesCo2PerMwh"
          $ref: "#/components/schemas/FreeNumberCharacteristic"
        sourceOfEmissionFactorValue:
          description: Any additional information detailing the source of the emissions
            value.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#sourceOfEmissionFactorValue"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        specificEmbeddedEmissionIndirect:
          description: "Value of the indirect embedded emissions, expressed in tonnes\
            \ of CO₂ equivalents per tonne of product, calculated with reference to\
            \ the specific production method and installation."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#specificEmbeddedEmissionIndirect"
          $ref: "#/components/schemas/FreeNumberCharacteristic"
        electricityConsumedMwhPerTonnesGood:
          description: "Value of the consumed electricity, expressed as MWh per tonne\
            \ of good."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#electricityConsumedMwhPerTonnesGood"
          $ref: "#/components/schemas/FreeNumberCharacteristic"
        sourceOfElectricity:
          description: "Describes the source of the electricity according to the official\
            \ value list: SOE01 Direct technical link to electricity generator, SOE02\
            \ (Bilateral) power purchase agreement, SOE03 Received from the grid."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#sourceOfElectricity"
          $ref: "#/components/schemas/FreeStringCharacteristic"
      required:
      - sourceOfEmissionFactor
      - emissionFactorTonnesCo2PerMwh
      - sourceOfEmissionFactorValue
      - specificEmbeddedEmissionIndirect
      - electricityConsumedMwhPerTonnesGood
      - sourceOfElectricity
    CurrencyTrait:
      type: string
      x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.standard_codes:1.0.0#CurrencyTrait"
      description: ISO 4217 regex
      pattern: "^[A-Z]{3}$"
    CarbonPricePaidEntity:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#CarbonPricePaidEntity"
      type: object
      properties:
        typeOfInstrument:
          description: "Attribute describing the form of carbon price, also referred\
            \ to as type of instrument. The values are defined as: 01 Carbon tax,\
            \ 02 Carbon levy, 03 Carbon fee, 04 National Emissions Trading System,\
            \ 05 Regional Emissions Trading System, 06 Other."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#typeOfInstrument"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        independendPersonId:
          description: Identifier of the independent person issuing a payment statement
            about the carbon price paid by the direct supplier or any other tier-n
            supplier in the value chain.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#independendPersonId"
          $ref: "#/components/schemas/KeyValueCharacteristic"
        descriptionAndIndicationOfLegalAct:
          description: Reference the description of the underlying legal act according
            to which the carbon price was paid.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#descriptionAndIndicationOfLegalAct"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        amountOfCarbonPricePaid:
          description: Monetary value of the paid carbon price.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#amountOfCarbonPricePaid"
          $ref: "#/components/schemas/FreeNumberCharacteristic"
        currency:
          description: currency code according to ISO 4217.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.standard_codes:1.0.0#currency"
          $ref: "#/components/schemas/CurrencyTrait"
        countryCode:
          description: Alphabetic three-character (alpha-3) code representing a country
            name.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.standard_codes:1.0.0#country"
          $ref: "#/components/schemas/CountryAlpha3Trait"
      required:
      - independendPersonId
    CarbonPricePaidCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#CarbonPricePaidCharacteristic"
      type: array
      items:
        $ref: "#/components/schemas/CarbonPricePaidEntity"
    EmissionsRecordsEntity:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#EmissionsRecordsEntity"
      type: object
      properties:
        attestationOfConformance:
          description: |-
            Connects Asset with AttestationOfConformance to link it with AttestationOfConformanceCollection, establishing the semantic relationship and context between both entities.
            Property to collect all attestation of conformance properties.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.shared.attestation_of_conformance:1.0.0#attestationOfConformance"
          $ref: "#/components/schemas/AttestationOfConformanceCollection"
        productionMethod:
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#productionMethod"
          $ref: "#/components/schemas/ProductionMethodCharacteristic"
        activityData:
          description: An object describing the temporal reference and the mass flow
            attributable to the specified production method within an installation.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#activityData"
          $ref: "#/components/schemas/ProductionMethodActivityDataCharacteristic"
        directEmissions:
          description: Object detailing the direct embedded emissions referenced to
            the specific production method and installation.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#directEmissions"
          $ref: "#/components/schemas/DirectEmissionsCharacteristic"
        indirectEmissions:
          description: Object deailing the indirect embedded emissions referenced
            to the specific production method and installation.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#indirectEmissions"
          $ref: "#/components/schemas/IndirectEmissionsCharacteristic"
        freeAllocationFactor:
          description: "The free allocation factor, expressed as tonnes of CO2​ equivalents\
            \ per tonne of product, based on the specific material and energy inputs\
            \ used to produce the product."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#freeAllocationFactor"
          $ref: "#/components/schemas/FreeNumberCharacteristic"
        carbonPricePaid:
          description: One or multiple objects describing the carbon price due in
            a third country per emission object on installation level.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#carbonPricePaid"
          $ref: "#/components/schemas/CarbonPricePaidCharacteristic"
      required:
      - attestationOfConformance
      - activityData
      - directEmissions
      - indirectEmissions
      - freeAllocationFactor
      - carbonPricePaid
    EmissionsRecordCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#EmissionsRecordCharacteristic"
      type: array
      items:
        $ref: "#/components/schemas/EmissionsRecordsEntity"
    InstallationEntity:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#InstallationEntity"
      type: object
      properties:
        installationIdentification:
          description: Object containing attributes to identify the installation.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#installationIdentification"
          $ref: "#/components/schemas/InstallationIdentificationCharacteristic"
        emissionsRecords:
          description: One or more objects detailing the specific production method(s)
            that the emission objects refer to; each installation may include multiple
            production methods.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#emissionsRecords"
          $ref: "#/components/schemas/EmissionsRecordCharacteristic"
        installationNetMass:
          description: "Net mass (in tonnes) of the CBAM-relevant good attributable\
            \ to the specific request, produced in the stated installation, calculated\
            \ as the sum across all applicable production methods within that installation."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#installationNetMass"
          $ref: "#/components/schemas/FreeNumberCharacteristic"
      required:
      - installationNetMass
    InstallationCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#InstallationCharacteristic"
      type: array
      items:
        $ref: "#/components/schemas/InstallationEntity"
    OperatorEntity:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#OperatorEntity"
      type: object
      properties:
        transactionReferenceDocumentLink:
          description: "Pointer to a reference document previously provided in businessTransactionDetails,\
            \ optionally refined to a specific part/item of that document, to indicate\
            \ which document (and which part of it) the operator-related response\
            \ data corresponds to."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#transactionReferenceDocumentLink"
          $ref: "#/components/schemas/TransactionReferenceDocumentLinkCharacteristic"
        operatorIdentification:
          description: Object containing attributes to identify the operator.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#operatorIdentification"
          $ref: "#/components/schemas/OperatorIdentificationCharacteristic"
        installation:
          description: "One or more objects describing each installation producing\
            \ the CBAM good that is the subject of this request. A single operator\
            \ may own multiple installations supplying the CBAM good in this request;\
            \ in that case, multiple installation objects are provided. Each installation\
            \ may include multiple production methods."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#installation"
          $ref: "#/components/schemas/InstallationCharacteristic"
        operatorNetMass:
          description: "Net mass (in tonnes) of the CBAM-relevant good attributable\
            \ to the specific request, summed over all installations belonging to\
            \ the operator described in this object."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#operatorNetMass"
          $ref: "#/components/schemas/FreeNumberCharacteristic"
    OperatorListCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#OperatorListCharacteristic"
      type: array
      items:
        $ref: "#/components/schemas/OperatorEntity"
    BusinessTransactionDetailCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#BusinessTransactionDetailCharacteristic"
      type: object
      properties:
        requestNetMass:
          description: "Net mass (tonnes) of CBAM-relevant good the request relates\
            \ to (e.g., from customs). Note, value shall match the sum across all\
            \ corresponding production method net mass values in the response."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#requestNetMass"
          $ref: "#/components/schemas/FreeNumberCharacteristic"
        requestReferencePeriodEnd:
          description: End timestamp of the requested reference period; start and
            end must be within the same calendar year.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#requestReferencePeriodEnd"
          $ref: "#/components/schemas/DatetimeCharacteristic"
        requestReferencePeriodStart:
          description: Start timestamp of the requested reference period; start and
            end must be within the same calendar year.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#requestReferencePeriodStart"
          $ref: "#/components/schemas/DatetimeCharacteristic"
        transactionReferenceDocuments:
          description: "List of reference documents used to identify the transaction\
            \ (e.g., invoice, purchase order, customs declaration, shipment); each\
            \ entry provides a document type and identifier value."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#transactionReferenceDocuments"
          $ref: "#/components/schemas/KeyValueCharacteristic"
      required:
      - requestNetMass
      - requestReferencePeriodEnd
      - requestReferencePeriodStart
      - transactionReferenceDocuments
    CnCodeTrait:
      type: string
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#CnCodeTrait"
      description: Characteristic for text properties without any constraints.
      maxLength: 8
      minLength: 8
    GoodEntity:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#GoodEntity"
      type: object
      properties:
        operator:
          description: One or multiple objects containing attributes that describe
            an operator each that legally owns the installations producing the CBAM
            good that is subject of this request. Operator can be different to supplier.
            One supplier (business partner of this transaction) can source the good
            defined in the business transaction from other suppliers. This can result
            in multiple operators (mutliple operator objects) involved in the depicted
            supply chain.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#operator"
          $ref: "#/components/schemas/OperatorListCharacteristic"
        businessTransactionDetails:
          description: "Object describing the specific business transaction between\
            \ the customer (e.g. importer) and the supplier, so the request can be\
            \ mapped to a real transaction."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#businessTransactionDetails"
          $ref: "#/components/schemas/BusinessTransactionDetailCharacteristic"
        productDescription:
          description: Free text describing the product and any characteristics that
            help identify the right business transaction per request.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#productDescription"
          $ref: "#/components/schemas/FreeStringCharacteristic"
        productIds:
          description: Set of product identifiers to identify the product from the
            business transaction.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#productIds"
          $ref: "#/components/schemas/KeyValueCharacteristic"
        cnCode:
          description: "This is the 8-digit CN code (combined nomenclature) of the\
            \ reported good, refering to official CBAM value list to ensure updated\
            \ content."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#cnCode"
          $ref: "#/components/schemas/CnCodeTrait"
      required:
      - operator
      - businessTransactionDetails
      - productDescription
      - cnCode
    GoodsListCharaceristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#GoodsListCharaceristic"
      type: array
      items:
        $ref: "#/components/schemas/GoodEntity"
    CompanyIdsCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#CompanyIdsCharacteristic"
      type: object
      properties:
        respondingCompanyIds:
          description: Object containing one or multiple identifiers of the responding
            company.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#respondingCompanyIds"
          $ref: "#/components/schemas/KeyValueCharacteristic"
        requestingCompanyIds:
          description: Object containing one or multiple pairs of identifier type
            and value of the requesting company.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#requestingCompanyIds"
          $ref: "#/components/schemas/KeyValueCharacteristic"
    RequestedElementsListCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#RequestedElementsListCharacteristic"
      type: array
      items:
        type: string
        x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#RequestedElementsAllowList"
        enum:
        - respondingCompanyIds
        - requestingCompanyIds
        - cnCode
        - productIds
        - productDescription
        - businessTransactionDetails
        - transactionReferenceDocumentLink
        - operatorIdentification
        - operatorNetMass
        - installationIdentification
        - installationNetMass
        - activityData
        - productionMethod
        - directEmissions
        - indirectEmissions
        - freeAllocationFactor
        - attestationOfConformance
        - carbonPricePaid
    Cbam:
      type: object
      x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#Cbam"
      properties:
        good:
          description: Array of good records to be reported. Each good record represents
            one declared good instance identified by CN Code and business transaction
            details and contains the CBAM-related information for that declared good.
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#good"
          $ref: "#/components/schemas/GoodsListCharaceristic"
        companyIds:
          description: "Object with attributes describing the identifiers of the two\
            \ business exchanging this dataset, namely the requesting and the responding\
            \ company."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#companyIds"
          $ref: "#/components/schemas/CompanyIdsCharacteristic"
        requestedElements:
          description: "List of element identifiers that define the scope of objects\
            \ and/or data attributes requested for inclusion in the supplier response.\
            \ The identifiers refer to sections and attributes defined in the corresponding\
            \ request type schemes, and indicate which parts of the data model are\
            \ expected to be provided in the response (subject to the rules of the\
            \ respective response schema, e.g., mandatory fields and conditional dependencies)."
          x-samm-aspect-model-urn: "urn:samm:io.catenax.cbam:1.0.0#requestedElements"
          $ref: "#/components/schemas/RequestedElementsListCharacteristic"
      required:
      - good
      - companyIds
      - requestedElements
  responses:
    Unauthorized:
      description: The requesting user or client is not authenticated.
    Forbidden:
      description: The requesting user or client is not authorized to access resources.
    NotFoundError:
      description: The requested resource has not been found.
    ClientError:
      description: Payload or user input is invalid. See error details in the payload
        for more information.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Cbam:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PagingSchema"
      description: The request was successful.
  requestBodies:
    Cbam:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Cbam"
      required: true
