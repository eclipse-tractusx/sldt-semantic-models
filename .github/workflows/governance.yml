name: Model Checks

on:
  pull_request:

jobs:
  # Determines which .ttl models changed in this PR, so the next job can
  # check each one as its own matrix leg (own check mark in the PR UI).
  # This is the only job that needs full repo history: it also hands the
  # full changed-files list to every matrix leg below, so those don't each
  # need to recompute it (and don't need repo history themselves either).
  detect-changed-models:
    runs-on: ubuntu-latest
    name: Detect Changed Models
    outputs:
      files: ${{ steps.list.outputs.files }}
      all_files: ${{ steps.list-all.outputs.files }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch origin main

      - name: List changed .ttl files
        id: list
        run: |
          echo "files=$(python .github/scripts/ms2_check.py --list-changed-files --base-branch origin/main)" >> "$GITHUB_OUTPUT"

      - name: List all changed files
        id: list-all
        run: |
          echo "files=$(python .github/scripts/ms2_check.py --list-all-changed-files --base-branch origin/main)" >> "$GITHUB_OUTPUT"

  # One job run per changed model - shows up as its own check mark, e.g.
  # "Check MS2 Criteria (io.catenax.batch/4.0.0/Batch.ttl)". Do NOT mark
  # this job itself as a required status check: its name (and how many
  # runs of it exist) varies per PR depending on which models changed, so
  # branch protection can't pin it down. Use ms2-criteria-gate for that.
  #
  # Each leg gets the full changed-files list from detect-changed-models
  # instead of computing its own git diff, so it needs no repo history at
  # all - just a shallow checkout of the files at HEAD. The SAMM CLI jar
  # is cached across legs/runs instead of every leg downloading it fresh.
  ms2-criteria-check:
    needs: detect-changed-models
    if: needs.detect-changed-models.outputs.files != '[]'
    runs-on: ubuntu-latest
    # Only this job needs it (least privilege): posts/updates one PR
    # checklist comment per model listing FAIL/WARN findings from criteria
    # with POST_COMMENT = True (see model-validation/github_comments.py).
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        ttl_file: ${{ fromJson(needs.detect-changed-models.outputs.files) }}
    name: Check MS2 Criteria (${{ matrix.ttl_file }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache SAMM CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .SAMMCLI
          key: samm-cli-${{ hashFiles('.github/scripts/config.json') }}

      - name: Install Python dependencies
        run: pip install jsonschema

      - name: Run MS2 criteria check
        env:
          # Only used by criteria with POST_COMMENT = True, to post inline
          # PR review comments (see model-validation/github_comments.py).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/ms2_check.py \
            --file "${{ matrix.ttl_file }}" \
            --changed-files '${{ needs.detect-changed-models.outputs.all_files }}'

  # Fixed-name summary of the matrix above - this is the one to configure
  # as a required status check in branch protection. Always runs (even
  # with zero changed models, where the matrix job above is skipped
  # entirely), so it's always available to select and never leaves a
  # required check stuck pending.
  ms2-criteria-gate:
    needs: [detect-changed-models, ms2-criteria-check]
    if: always()
    runs-on: ubuntu-latest
    name: Summary Check
    steps:
      - name: Evaluate matrix result
        run: |
          result="${{ needs.ms2-criteria-check.result }}"
          echo "ms2-criteria-check matrix result: $result"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            echo "At least one model failed its MS2 criteria check."
            exit 1
          fi
          echo "All changed models passed (or none changed)."
