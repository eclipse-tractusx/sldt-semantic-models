      type: object
      properties:
        TemperatureRangeIdleState_LowerBoundary:
          description: "Lower boundary of the surrounding temperature range, which\
            \ the battery can safely withstand."
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.3#temperatureRangeIdleStateLowerBoundary"
          allOf:
          - $ref: "#/components/schemas/TemperatureRangeBoundary"
        TemperatureRangeIdleState_UpperBoundary:
          description: "Upper boundary of the surrounding temperature range, which\
            \ the battery can safely withstand."
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.3#temperatureRangeIdleStateUpperBoundary"
          allOf:
          - $ref: "#/components/schemas/TemperatureRangeBoundary"
      required:
      - TemperatureRangeIdleState_LowerBoundary
      - TemperatureRangeIdleState_UpperBoundary
    TemperatureCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.3#TemperatureCharacteristic"
      type: object
      allOf:
      - $ref: "#/components/schemas/Temperature"
    ExpectedLifeTime:
      type: integer
      minimum: 0
      maximum: 4294967295
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.3#ExpectedLifeTime"
    ExpectedNumberOfCycles:
      type: integer
      minimum: 0
      maximum: 4294967295
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.3#ExpectedNumberOfCycles"
    CapacityThresholdForExhaustion:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.3#CapacityThresholdForExhaustion"
    DocumentIdentifierSet:
      description: "Each document is uniquely discoverable via its identifier. If\
        \ more information is needed, please refer to the 'Handover Documentation'."
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.shared:3.1.1#DocumentIdentifierSet"
      type: array
      items:
        type: string
        x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.shared:3.1.1#DocumentIdentifierSetTrait"
        description: Alphanumeric character sequence uniquely identifying a document.
        minLength: 1
      uniqueItems: true
    CRateLifeCycleTest:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.3#CRateLifeCycleTest"
    Lifetime:
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.3#Lifetime"
      type: object
      properties:
        ExpectedLifetimeInCalendarYears:
          description: "\n\tThe battery passport must include information about the\
            \ expected battery lifetime in calendar years.\n\t\n\tThe update interval\
            \ must be upon placement on the market and upon change of the battery\
            \ status.\n\t\n\t\nDIN DKE Spec 99100:2025-02 chapter reference: 6.7.6.2\n\
            \t"
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.3#expectedLifetime"
          allOf:
          - $ref: "#/components/schemas/ExpectedLifeTime"
        ExpectedNumberOfCycles:
          description: "\n\tExpected battery lifetime expressed in cycles.\nThe exception\
            \ for non-cycle applications in Article 10 appears sensible, but is not\
            \ included in the Annex XIII provision.\n\t\n\tThe data attribute is defined\
            \ by measurement conditions of the cycle-life test such as the C-Rate\
            \ (see below) and the depth of discharge in the cycle-life test\n\t\n\t\
            \nDIN DKE Spec 99100:2025-02 chapter reference: 6.7.6.3\n\t"
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.3#expectedNumberOfCycles"
          allOf:
          - $ref: "#/components/schemas/ExpectedNumberOfCycles"
        CapacityThresholdExhaustion:
          description: "\n\tThe percentage of SOCE, above which the battery is still\
            \ considered operational as EV battery in its current life, as provided\
            \ by the economic operator.\n\t\n\t\nDIN DKE Spec 99100:2025-02 chapter\
            \ reference: 6.7.6.9\n\t"
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.3#capacityThresholdForExhaustion"
          allOf:
          - $ref: "#/components/schemas/CapacityThresholdForExhaustion"
        CycleLifeReferenceTest:
          description: "\n\tThe battery passport must include information about the\
            \ expected battery lifetime expressed in cycles, and reference test used.\
            \ \n\t\n\t\nDIN DKE Spec 99100:2025-02 chapter reference: 6.7.6.5\n\t"
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.3#cycleLifeReferenceTest"
          allOf:
          - $ref: "#/components/schemas/DocumentIdentifierSet"
        CRateOfRelevantCycleLifeTest:
          description: "\n\tThe C-rate should be provided separately for both the\
            \ charge and discharge of the battery, if applicable.\n\t\n\tThe exception\
            \ for non-cycle applications as mentioned in \"Expected lifetime: Number\
            \ of charge-discharge cycles\" should apply to this data attribute as\
            \ well.\n\n\t\nDIN DKE Spec 99100:2025-02 chapter reference: 6.7.6.6\n\
            \t"
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.3#cRateLifeCycleTest"
          allOf:
          - $ref: "#/components/schemas/CRateLifeCycleTest"
      required:
      - ExpectedLifetimeInCalendarYears
      - ExpectedNumberOfCycles
      - CapacityThresholdExhaustion
      - CycleLifeReferenceTest
      - CRateOfRelevantCycleLifeTest
