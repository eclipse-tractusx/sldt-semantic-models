        minLength: 1
      uniqueItems: true
    CRateLifeCycleTest:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#CRateLifeCycleTest"
    Lifetime:
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#Lifetime"
      type: object
      properties:
        ExpectedLifetimeInCalendarYears:
          description: |-
            The battery passport must include information about the expected battery lifetime in calendar years.

            The update interval must be upon placement on the market and upon change of the battery status.

            DIN DKE Spec 99100 chapter reference: 6.7.6.2
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#expectedLifetime"
          allOf:
          - $ref: "#/components/schemas/ExpectedLifeTime"
        ExpectedNumberOfCycles:
          description: |-
            Expected battery lifetime expressed in cycles.
            The exception for non-cycle applications in Article 10 appears sensible, but is not included in the Annex XIII provision.
            The data attribute is defined by measurement conditions of the cycle-life test such as the C-Rate (see below) and the depth of discharge in the cycle-life test

            DIN DKE Spec 99100 chapter reference: 6.7.6.3
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#expectedNumberOfCycles"
          allOf:
          - $ref: "#/components/schemas/ExpectedNumberOfCycles"
        CapacityThresholdExhaustion:
          description: |-
            The percentage of SOCE, above which the battery is still considered operational as EV battery in its current life, as provided by the economic operator.

            DIN DKE Spec 99100 chapter reference: 6.7.6.9
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#capacityThresholdForExhaustion"
          allOf:
          - $ref: "#/components/schemas/CapacityThresholdForExhaustion"
        CycleLifeReferenceTest:
          description: "The battery passport must include information about the expected\
            \ battery lifetime expressed in cycles, and reference test used. \n\n\
            DIN DKE Spec 99100 chapter reference: 6.7.6.5"
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#cycleLifeReferenceTest"
          allOf:
          - $ref: "#/components/schemas/DocumentIdentifierSet"
        CRateOfRelevantCycleLifeTest:
          description: |-
            The C-rate should be provided separately for both the charge and discharge of the battery, if applicable.

            The exception for non-cycle applications as mentioned in "Expected lifetime: Number of charge-discharge cycles" should apply to this data attribute as well.

            DIN DKE Spec 99100 chapter reference: 6.7.6.6
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#cRateLifeCycleTest"
          allOf:
          - $ref: "#/components/schemas/CRateLifeCycleTest"
      required:
      - ExpectedLifetimeInCalendarYears
      - ExpectedNumberOfCycles
      - CapacityThresholdExhaustion
      - CycleLifeReferenceTest
      - CRateOfRelevantCycleLifeTest
