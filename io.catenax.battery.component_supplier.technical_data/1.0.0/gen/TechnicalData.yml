          allOf:
          - $ref: "#/components/schemas/RoundTripEnergyEfficiencyCharacteristic"
        Resistance:
          description: "\n\tData elements regarding internal resistance and electrochemical\
            \ impedance.\n\t\n\t\nDIN DKE Spec 99100:2025-02 chapter reference: 6.7.5\n\
            \t"
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.3#resistance"
          allOf:
          - $ref: "#/components/schemas/ResistanceCharacteristic"
        PowerCapability:
          description: "\n\tInformation regarding power capability.\n\t\n\t\nDIN DKE\
            \ Spec 99100:2025-02 chapter reference: 6.7.3\n\t"
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.3#powerCapability"
          allOf:
          - $ref: "#/components/schemas/PowerCapabilityCharacteristic"
        Temperature:
          description: "\n\tInformation regarding temperature conditions.\n\t\n\t\n\
            DIN DKE Spec 99100:2025-02 chapter reference: 6.7.7\n\t"
