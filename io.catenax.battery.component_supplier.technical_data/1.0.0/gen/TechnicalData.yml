    DocumentIdentifierSet:
      description: "Each document is uniquely discoverable via its identifier. If\
        \ more information is needed, please refer to the 'Handover Documentation'."
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.shared:3.1.0#DocumentIdentifierSet"
