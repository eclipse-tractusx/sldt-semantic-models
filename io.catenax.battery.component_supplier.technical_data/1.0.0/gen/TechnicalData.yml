---
openapi: 3.0.3
info:
  title: TechnicalData
  version: v1
  x-samm-aspect-model-urn: "urn:samm:io.catenax.batterypass.component_supplier.technical_data:1.0.0#TechnicalData"
servers:
- url: catenax.io/api/v1
  variables:
    api-version:
      default: v1
paths:
  /{tenant-id}/technical-data:
    get:
      tags:
      - TechnicalData
      operationId: getTechnicalData
      parameters:
      - name: tenant-id
        in: path
        description: The ID of the tenant owning the requested Twin.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          $ref: "#/components/responses/TechnicalData"
        "400":
          $ref: "#/components/responses/ClientError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundError"
components:
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      required:
      - details
      properties:
        message:
          type: string
          minLength: 1
        path:
          type: string
          minLength: 1
        details:
          type: object
          minLength: 1
          additionalProperties:
            type: object
        code:
          type: string
          nullable: true
    Text:
      type: string
      x-samm-aspect-model-urn: "urn:samm:org.eclipse.esmf.samm:characteristic:2.2.0#Text"
      description: "Describes a Property which contains plain text. This is intended\
        \ exclusively for human readable strings, not for identifiers, measurement\
        \ values, etc."
    ResourcePath:
      type: string
      format: uri
      x-samm-aspect-model-urn: "urn:samm:org.eclipse.esmf.samm:characteristic:2.2.0#ResourcePath"
      description: The path of a resource.
    WarrantyPeriodTrait:
      type: string
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#WarrantyPeriodTrait"
      description: ISO 8601 duration format.
      pattern: ^P(?!$)((\d+Y)?(\d+M)?(\d+D)?(T(?=\d)(\d+H)?(\d+M)?(\d+S)?)?|T(?=\d)(\d+H)?(\d+M)?(\d+S)?)$
    WarrantyInformationEntity:
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#WarrantyInformationEntity"
      type: object
      properties:
        WarrantyPeriod:
          description: "\n   The battery passport must include information about the\
            \ period for which the commercial warranty applies.\n   \n   DIN DKE Spec\
            \ chapter reference: 6.1.3.4\n   \n   The format shall be provided in\
            \ ISO 8601 Notation for duration.\n   "
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#warrantyPeriod"
          allOf:
          - $ref: "#/components/schemas/WarrantyPeriodTrait"
      required:
      - WarrantyPeriod
    WarrantyInformationCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#WarrantyInformationCharacteristic"
      type: object
      allOf:
      - $ref: "#/components/schemas/WarrantyInformationEntity"
    BatteryCategoryEnum:
      type: string
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#BatteryCategoryEnum"
      enum:
      - lmt
      - ev
      - industrial
      - stationary
    BatteryMassMeasurable:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#BatteryMassMeasurable"
      description: |-
        Weight of the battery
        EUBR: Annex XIII (1a) - Annex VI Part A (5)
    MimeType:
      type: string
      x-samm-aspect-model-urn: "urn:samm:org.eclipse.esmf.samm:characteristic:2.2.0#MimeType"
      description: "A MIME type as defined in RFC 2046, for example \"application/pdf\"\
        ."
    FileWithContentType:
      description: A file is a data element that represents an address to a file (a
        locator). The value is a URI that can represent an absolute or relative path.
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.shared:3.1.0#FileWithContentType"
      type: object
      properties:
        value:
          description: |-
            Path and name of the file (with file extension).

            The path can be absolute or relative.
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.shared:3.1.0#resourceValue"
          allOf:
          - $ref: "#/components/schemas/ResourcePath"
        contentType:
          description: Content type of the content of the file or blob.
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.shared:3.1.0#contentType"
          allOf:
          - $ref: "#/components/schemas/MimeType"
    MultiLanguageTexts:
      description: A set of language-text items.
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.shared:3.1.0#MultiLanguageTexts"
      type: array
      items:
        type: object
        x-samm-aspect-model-urn: "urn:samm:org.eclipse.esmf.samm:characteristic:2.2.0#MultiLanguageText"
        description: "Describes a Property which contains plain text in multiple languages.\
          \ This is intended exclusively for human readable strings, not for identifiers,\
          \ measurement values, etc."
      uniqueItems: true
    ProductImage:
      description: Pictorial representation of the product related to an application.
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.generic.technical_data:2.0.0#ProductImage"
      type: object
      properties:
        ImageFile:
          description: Picture of the product (low resolution) 72 dpi / rgb (GIF or
            JPG).
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.generic.technical_data:2.0.0#imageFile"
          allOf:
          - $ref: "#/components/schemas/FileWithContentType"
        ImageNote:
          description: Notes or explanations about the image provided.
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.generic.technical_data:2.0.0#imageNote"
          allOf:
          - $ref: "#/components/schemas/MultiLanguageTexts"
      required:
      - ImageFile
    ProductImageSet:
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.generic.technical_data:2.0.0#ProductImageSet"
      type: array
      items:
        $ref: "#/components/schemas/ProductImage"
      uniqueItems: true
    GeneralInformationEntity:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.batterypass.component_supplier.technical_data:1.0.0#GeneralInformationEntity"
      type: object
      properties:
        ManufacturerName:
          description: "Legally valid designation of the natural or judicial person\
            \ which is directly responsible for the design, production, packaging\
            \ and labeling of a product in respect to its being brought into circulation."
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.generic.technical_data:2.0.0#manufacturerName"
          allOf:
          - $ref: "#/components/schemas/Text"
        CompanyLogo:
          description: "Imagefile for logo of the company provided in common format\
            \ (.png, .jpg)"
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.generic.technical_data:2.0.0#companyLogo"
          allOf:
          - $ref: "#/components/schemas/ResourcePath"
        ManufacturerIdentifier:
          description: |-
            A battery passport must include information identifying the manufacturer.

             DIN DKE Spec 99100 chapter reference: 6.1.2.4
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#manufacturerIdentifier"
          allOf:
          - $ref: "#/components/schemas/Text"
        WarrantyInformation:
          description: "\n   The battery passport must include information about the\
            \ period for which the commercial warranty applies.\n   \n   DIN DKE Spec\
            \ chapter reference: 6.1.3.4\n   "
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#warrantyInformation"
          allOf:
          - $ref: "#/components/schemas/WarrantyInformationCharacteristic"
        BatteryCategory:
          description: |-
            Categories relevant for the battery passport: LMT battery, electric vehicle battery, stationary or other industrial battery >2kWh.

            DIN DKE Spec chapter reference: 6.1.3.5
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#batteryCategory"
          allOf:
          - $ref: "#/components/schemas/BatteryCategoryEnum"
        BatteryMass:
          description: |-
            Mass of the entire battery in kilograms. Voluntary: if the battery is defined on pack or module level: also weight of the modules and/or cells.

            DIN DKE Spec chapter reference: 6.1.3.6
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#batteryMass"
          allOf:
          - $ref: "#/components/schemas/BatteryMassMeasurable"
        ProductImages:
          description: "Image files for associated product provided in common format\
            \ (.png, .jpg)."
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.generic.technical_data:2.0.0#productImages"
          allOf:
          - $ref: "#/components/schemas/ProductImageSet"
      required:
      - ManufacturerName
      - ManufacturerIdentifier
    GeneralInformationCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.catenax.batterypass.component_supplier.technical_data:1.0.0#GeneralInformationCharacteristic"
      type: object
      allOf:
      - $ref: "#/components/schemas/GeneralInformationEntity"
    Voltage:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#Voltage"
    RatedCapacity:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#RatedCapacity"
    CapacityFadeValue:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#CapacityFadeValue"
    RatedEnergy:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#RatedEnergy"
    CapacityEnergyVoltage:
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#CapacityEnergyVoltage"
      type: object
      properties:
        NominalVoltage:
          description: |-
            Nominal voltage the battery is rated for.

            DIN DKE Spec 99100 chapter reference: 6.7.2.11
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#nominalVoltage"
          allOf:
          - $ref: "#/components/schemas/Voltage"
        MinVoltage:
          description: |-
            Minimum voltage the battery is rated for.

            DIN DKE Spec 99100 chapter reference: 6.7.2.9
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#minimumVoltage"
          allOf:
          - $ref: "#/components/schemas/Voltage"
        MaxVoltage:
          description: |-
            Maximum voltage the battery is rated for.

            DIN DKE Spec 99100 chapter reference: 6.7.2.10
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#maximumVoltage"
          allOf:
          - $ref: "#/components/schemas/Voltage"
        RatedCapacity:
          description: |-
            Rated capacity is the total number of ampere-hours (Ah) that can be withdrawn from a fully charged battery under reference conditions (see BattReg Annex IV (1)).

            DIN DKE Spec 99100 chapter reference: 6.7.2.2
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#ratedCapacity"
          allOf:
          - $ref: "#/components/schemas/RatedCapacity"
        CapacityFade:
          description: |-
            The capacity fade is the Decrease over time and upon usage in the amount of charge that a battery can deliver at the rated voltage, with respect to the original rated capacity (see BattReg Annex IV (2)) as declared by the manufacturer.

            DIN DKE Spec 99100 chapter reference: 6.7.2.4
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#capacityFade"
          allOf:
          - $ref: "#/components/schemas/CapacityFadeValue"
        CertifiedUsableBatteryEnergy:
          description: |-
            The certified usable battery energy is the usable battery energy according to the procedure in the UN GTR No 22 as determined during the certification of the vehicle.

            DIN DKE Spec 99100 chapter reference: 6.7.2.5
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#ratedEnergy"
          allOf:
          - $ref: "#/components/schemas/RatedEnergy"
      required:
      - NominalVoltage
      - MinVoltage
      - MaxVoltage
      - RatedCapacity
    CapacityEnergyVoltageCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#CapacityEnergyVoltageCharacteristic"
      type: object
      allOf:
      - $ref: "#/components/schemas/CapacityEnergyVoltage"
    EnergyEfficiency:
      type: integer
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#EnergyEfficiency"
    RoundTripEfficiencyAt50PercentCycleLife:
      type: integer
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#RoundTripEfficiencyAt50PercentCycleLife"
    energyRoundTripEfficiencyFadeValue:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#energyRoundTripEfficiencyFadeValue"
    BatteryDischargingRate:
      type: integer
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#BatteryDischargingRate"
    RoundTripEnergyEfficiency:
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#RoundTripEnergyEfficiency"
      type: object
      properties:
        InitialRoundTripEnergyEfficiency:
          description: Initial round trip energy efficiency means the ratio of the
            net energy delivered by a battery during a discharge test to the total
            energy required to restore the initial State of Charge by a standard charge.
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#initialRoundTripEnergyEfficiency"
          allOf:
          - $ref: "#/components/schemas/EnergyEfficiency"
        RoundTripEnergyEfficiencyAt50PercentOfCycleLife:
          description: |
            Initial round trip energy efficiency shall be measured at reference conditions that include the specification of 50 % of cycle-life.

            Test methods and reference conditions should separately consider non-cycle applications and batteries with very long cycle-life.

            DIN DKE Spec 99100 chapter reference: 6.7.4.3
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#roundTripEfficiencyAt50PercentCycleLife"
          allOf:
          - $ref: "#/components/schemas/RoundTripEfficiencyAt50PercentCycleLife"
        EnergyRoundTripEfficiencyFade:
          description: |-
            Energy round trip efficiency fade is the decrease of round trip energy efficiency as percentage.

            DIN DKE Spec 99100 chapter reference: 6.7.4.5
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#energyRoundTripEfficiencyFade"
          allOf:
          - $ref: "#/components/schemas/energyRoundTripEfficiencyFadeValue"
        InitialSelfDischargingRate:
          description: Initial self-discharge in % of capacity per unit of time in
            defined conditions (temperature range etc) as pre-use metric.
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#initialSelfDischargingRate"
          allOf:
          - $ref: "#/components/schemas/BatteryDischargingRate"
      required:
      - InitialRoundTripEnergyEfficiency
      - RoundTripEnergyEfficiencyAt50PercentOfCycleLife
    RoundTripEnergyEfficiencyCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#RoundTripEnergyEfficiencyCharacteristic"
      type: object
      allOf:
      - $ref: "#/components/schemas/RoundTripEnergyEfficiency"
    InternalResistance:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#InternalResistance"
    ResistanceIncrease:
      type: integer
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#ResistanceIncrease"
    Resistance:
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#Resistance"
      type: object
      properties:
        InitialInternalResistanceAtBatteryCellLevel:
          description: "\n  Internal battery cell and pack resistance / Internal resistance\
            \ (in Ohm).\n  \n  Measure of a battery cell’s opposition to current flow\
            \ at the beginning of its operational life, affecting its performance,\
            \ efficiency, and heat generation (internal resistance means the absolute\
            \ value of the quotient of the voltage drop between the terminals by the\
            \ electric current increase in the battery circuit during a current pulse).\n\
            \  "
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#initialInternalResistanceAtBatteryCellLevel"
          allOf:
          - $ref: "#/components/schemas/InternalResistance"
        InitialInternalResistanceAtBatteryPackLevel:
          description: "\n  Initial (Pre-Use) internal resistance at battery pack\
            \ level.\n  \n  Measure of opposition to current flow in an entire battery\
            \ pack at the start of its operational life, affecting overall performance,\
            \ efficiency, and heat generation (internal resistance means the absolute\
            \ value of the quotient of the voltage drop between the terminals by the\
            \ electric current increase in the battery circuit during a current pulse).\n\
            \  "
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#initialInternalResistanceAtBatteryPackLevel"
          allOf:
          - $ref: "#/components/schemas/InternalResistance"
        InitialInternalResistanceAtBatteryModuleLevel:
          description: "\n  Initial internal resistance at battery module level.\n\
            \  \n  Initial internal resistance means the absolute beginning value\
            \ of the quotient of the voltage drop between the terminals by the electric\
            \ current increase in the battery circuit during a current pulse.\n  "
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#initialInternalResistanceAtBatteryModuleLevel"
          allOf:
          - $ref: "#/components/schemas/InternalResistance"
        InternalResistanceIncreaseAtBatteryCellLevel:
          description: Internal resistance increase at battery cell level.
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#internalResistanceIncreaseAtBatteryCellLevel"
          allOf:
          - $ref: "#/components/schemas/ResistanceIncrease"
        InternalResistanceIncreaseAtBatteryPackLevel:
          description: '''Internal resistance increase at battery pack level'' defined
            by ''increase of internal resistance in % as calculated from current and
            initial values (calculated from initial and current internal resistance
            on battery pack level).'
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#internalResistanceIncreaseAtBatteryPackLevel"
          allOf:
          - $ref: "#/components/schemas/ResistanceIncrease"
        InternalResistanceIncreaseAtBatteryModuleLevel:
          description: "Internal resistance increase at battery module level level'\
            \ defined by 'internal resistance increase on battery module level, calculated\
            \ from initial and current internal resistance on battery module level."
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#internalResistanceIncreaseAtBatteryModuleLevel"
          allOf:
          - $ref: "#/components/schemas/ResistanceIncrease"
      required:
      - InitialInternalResistanceAtBatteryCellLevel
      - InitialInternalResistanceAtBatteryPackLevel
      - InternalResistanceIncreaseAtBatteryPackLevel
    ResistanceCharacteristic:
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#ResistanceCharacteristic"
      type: object
      allOf:
      - $ref: "#/components/schemas/Resistance"
    PowerCapabilityAtSoc:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#PowerCapabilityAtSoc"
    PowerFade:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#PowerFade"
    PowerCapabilityRatio:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#PowerCapabilityRatio"
      description: Ratio between nominal allowed battery power (W) and battery energy
        (Wh).
    AtSoC:
      type: number
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#AtSoC"
    PowerCapabilityAtSoCTrait:
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#PowerCapabilityAtSoCTrait"
      type: array
      items:
        description: |-
          Power capability measured at a reference condition, for example at 80% or 20% state of charge (SoC).

          DIN DKE Spec 99100 chapter reference: 6.7.3.2
        x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#PowerCapabilityAtCharacteristic"
        type: object
        properties:
          atSoC:
            description: |-
              Available capacity in a battery expressed as a percentage of remaining capacity.

              Power capability shall be measured at reference conditions, which must include measurements at 80% and 20% state of charge for EV and industrial batteries.
            x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#atSoC"
            allOf:
            - $ref: "#/components/schemas/AtSoC"
          powerCapabilityAt:
            description: Power capability.
            x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#powerCapabilityAt"
            allOf:
            - $ref: "#/components/schemas/PowerCapabilityAtSoc"
        required:
        - atSoC
        - powerCapabilityAt
      minItems: 1
    PowerCapability:
      x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#PowerCapability"
      type: object
      properties:
        MaximumPermittedBatteryPower:
          description: "Maximum permitted power the battery is rated for, includes\
            \ the data relevant for power limits."
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#maximumPermittedBatteryPower"
          allOf:
          - $ref: "#/components/schemas/PowerCapabilityAtSoc"
        PowerFade:
          description: "Power fade (in %) means the decrease over time and upon usage\
            \ in the amount of power that a battery can deliver at the rated voltage.\
            \ (see BattReg Annex IV (4)).\n\nPower fade should be calculated using\
            \ original and remaining power capability following the formula below:\n\
            Pfade(x) = (1-P(x)) / PBOL\" 100\" %\" \nwhere\nx \tis the aging parameter\
            \ (e.g. storage time, number of cycles, etc.);\nP(x) \tis the power capability\
            \ at aging parameter x;\nPBOL \tis the power capability at begin of life.\n\
            \nDIN DKE Spec 99100 chapter reference: 6.7.3.4"
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#powerFade"
          allOf:
          - $ref: "#/components/schemas/PowerFade"
        RatioNominalBatteryPowerAndBatteryEnergy:
          description: "The nominal battery power is the suitable approximate value\
            \ of the power capability used to designate or identify the battery, while\
            \ the battery energy is determined in reference conditions to be defined.\n\
            \   \n   DIN DKE Spec 99100 chapter reference: 6.7.3.6\n   "
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#powerCapabilityRatio"
          allOf:
          - $ref: "#/components/schemas/PowerCapabilityRatio"
        OriginalPowerCapability:
          description: "List of pre-use power capabilities (definition of power capability\
            \ as given in Battery Regulation).\n\n Power capability shall be measured\
            \ at reference conditions, which must include measurements at 80% and\
            \ 20% state of charge for EV and industrial batteries. \n\nDIN DKE Spec\
            \ 99100 chapter reference: 6.7.3.2\n\n"
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#originalPowerCapability"
          allOf:
          - $ref: "#/components/schemas/PowerCapabilityAtSoCTrait"
      required:
      - MaximumPermittedBatteryPower
      - PowerFade
      - RatioNominalBatteryPowerAndBatteryEnergy
      - OriginalPowerCapability
