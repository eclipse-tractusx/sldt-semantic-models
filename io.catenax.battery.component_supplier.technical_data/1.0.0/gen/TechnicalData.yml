          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#powerCapability"
          allOf:
          - $ref: "#/components/schemas/PowerCapabilityCharacteristic"
        Temperature:
          description: |-
            Information regarding temperature conditions.

            DIN DKE Spec 99100 chapter reference: 6.7.7
          x-samm-aspect-model-urn: "urn:samm:io.admin-shell.idta.batterypass.technical_data:1.0.2#temperature"
          allOf:
          - $ref: "#/components/schemas/TemperatureCharacteristic"
        Lifetime:
